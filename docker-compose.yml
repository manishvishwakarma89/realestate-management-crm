version: "3.8"

networks:
  app-network:
    driver: bridge

services:
  mongodb:
    container_name: mongo-service
    image: mongo:latest
    volumes:
      - ./backend/mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - app-network

  backend:
    container_name: backend
    build: ./backend
    env_file:
      - ./backend/.env.sample
    volumes:
      - ./backend/db.json:/app/db.json
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - app-network

  frontend:
    container_name: frontend
    build: ./frontend
    env_file:
      - ./frontend/.env.sample
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  data: