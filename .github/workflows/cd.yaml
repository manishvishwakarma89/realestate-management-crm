name: CD (Deploy to Localhost)

on:
  workflow_run:
    workflows: ["CI"] # Triggers automatically when your CI workflow finishes successfully
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted # Forces the job to run directly on your local machine
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}

    steps:
      # 1. Pull the latest code changes (like updated compose configurations)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate the local machine with Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Pull new images and restart the containers locally
      - name: Deploy Live Application
        run: |
          echo "Deploying latest application stack..."
          docker compose down
          docker compose up -d --pull always
          
      # 4. Optional: Clean up dangling, unused older image layers to save disk space
      - name: System Prune
        run: docker image prune -f
