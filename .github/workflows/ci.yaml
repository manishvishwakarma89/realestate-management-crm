name: CI

on: 
  push:
    branches:
      - main
      - feat/devops

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and Push Backend (Pointing to your distroless Dockerfile)
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.distroless
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/estate-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/estate-backend:latest

      # 5. Build and Push Frontend (Fixed tags and distroless target)
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile-multi
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/estate-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/estate-frontend:latest
