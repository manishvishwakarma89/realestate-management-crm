name: CI

on: 
  push:
    branches:
      - main
      - feat/devops
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6con

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build and Push backend
        uses: docker/build-push-activ@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{secrets.DOCKERHUB_USERNAME}}/estate-backend:${{github.sha}}
            ${{secrets.DOCKERHUB_USERNAME}}/estate-backend:latest

      - name: Build and Push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            {{secrets.DOCKERHUB_USERNAME}}/estate-backend:${{github.sha}}
            ${{secrets.DOCKERHUB_USERNAME}}/estate-backend:latest
            
              
      

      
      
